name: Build and deploy public PWA

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Extract application source
        shell: bash
        run: |
          rm -rf _app
          mkdir -p _app
          python -m zipfile -e kensho-source.zip _app
          APP_DIR="$(dirname "$(find _app -type f -name package.json -print -quit)")"
          if [ -z "$APP_DIR" ] || [ ! -f "$APP_DIR/package.json" ]; then
            echo "package.json was not found in kensho-source.zip" >&2
            exit 1
          fi
          if [ -d overrides ]; then
            cp -R overrides/. "$APP_DIR"/
          fi
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
          echo "Application root: $APP_DIR"

      - name: Run tests
        shell: bash
        run: |
          cd "$APP_DIR"
          npm test

      - name: Discover new campaign candidates
        shell: bash
        run: |
          cd "$APP_DIR"
          npm run discover

      - name: Auto-review and publish new candidates
        shell: bash
        run: |
          cd "$APP_DIR"
          npm run promote

      - name: Upload discovery queue
        uses: actions/upload-artifact@v4
        with:
          name: discovery-queue
          path: |
            ${{ env.APP_DIR }}/data/discovered-campaigns.json
            ${{ env.APP_DIR }}/data/review-queue.json
            ${{ env.APP_DIR }}/data/auto-campaigns.json
          retention-days: 14

      - name: Refresh reviewed campaign data
        shell: bash
        run: |
          cd "$APP_DIR"
          npm run refresh
          npm run prune

      - name: Build public files
        shell: bash
        run: |
          cd "$APP_DIR"
          npm run build
          test -f public/index.html
          test -f public/manifest.webmanifest
          test -f public/service-worker.js

      - name: Add Hitotsuzutsu GTD PWA
        shell: bash
        run: |
          rm -rf "$APP_DIR/public/hitotsuzutsu"
          mkdir -p "$APP_DIR/public/hitotsuzutsu"
          cp -R hitotsuzutsu/. "$APP_DIR/public/hitotsuzutsu"/
          test -f "$APP_DIR/public/hitotsuzutsu/index.html"
          test -f "$APP_DIR/public/hitotsuzutsu/manifest.webmanifest"
          test -f "$APP_DIR/public/hitotsuzutsu/sw.js"

      - name: Reject private endpoints in published data
        shell: bash
        run: |
          cd "$APP_DIR"
          files=$(find public -type f \( -name '*.json' -o -name '*.html' \) -print)
          if [ -n "$files" ] && grep -Eiq 'https?://(127\.0\.0\.1|localhost|100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.)|\.ts\.net([/:]|$)|[?&](token|secret)=[A-Za-z0-9._~-]{16,}' $files; then
            echo 'Private or credential-bearing endpoint detected in publishable data.' >&2
            exit 1
          fi

      - name: Save automation state to repository
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        shell: bash
        run: |
          cp "$APP_DIR/data/auto-campaigns.json" overrides/data/auto-campaigns.json
          cp "$APP_DIR/data/review-queue.json" overrides/data/review-queue.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898699+github-actions[bot]@users.noreply.github.com'
          git add overrides/data/auto-campaigns.json overrides/data/review-queue.json
          if git diff --cached --quiet; then
            echo 'No automation state changes.'
            exit 0
          fi
          git commit -m 'chore: update auto-published campaigns [skip ci]'
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          echo 'Could not push automation state.' >&2
          exit 1

      - name: Write run summary
        if: always()
        shell: bash
        run: |
          cd "$APP_DIR"
          node -e '
            const fs=require("fs");const r=p=>{try{return JSON.parse(fs.readFileSync(p,"utf8"))}catch{return null}};
            const auto=r("data/auto-campaigns.json")||[];const q=r("data/review-queue.json")||{items:[]};const pub=r("public/public-campaigns.json")||{campaigns:[]};
            const held=q.items.filter(x=>x.status==="held");
            let md=`## 懸賞データ自動更新\n\n- 公開案件: ${pub.campaigns.length}件（うち自動掲載 ${auto.length}件）\n- 保留中の候補: ${held.length}件（自動で再判定）\n\n`;
            if(held.length)md+="| 掲載元 | URL | 理由 | 試行 |\n|---|---|---|---|\n"+held.map(x=>`| ${x.source} | ${x.url} | ${x.lastReason||""} | ${x.attempts} |`).join("\n")+"\n";
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,md);
          '

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.APP_DIR }}/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
